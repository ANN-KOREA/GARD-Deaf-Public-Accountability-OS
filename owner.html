function release(data,facIds,schema){
 const issues=validate(data,schema);if(issues.some(x=>x.level==='error'))throw new Error('원본 검증 오류 '+issues.filter(x=>x.level==='error').length+'건. 먼저 정정하세요.');
 if(data.meta.contains_personal_data)throw new Error('개인정보 포함 데이터 공개 금지');
 if(!Array.isArray(facIds)||!facIds.length)throw new Error('공개할 시설을 하나 이상 선택하세요');
 const fs=new Set(facIds);const accepted=(data.facilities||[]).filter(r=>fs.has(r.facility_id));if(!accepted.length)throw new Error('선택한 시설이 데이터셋에 없습니다');
 const publicEv=(data.evidence||[]).filter(r=>r.access_scope==='public');const evSet=new Set(publicEv.map(r=>r.evidence_id));
 const validEvidence=r=>Array.isArray(r.evidence_ids)&&r.evidence_ids.length>0&&r.evidence_ids.every(id=>evSet.has(id));
 const r0=accepted.filter(validEvidence);if(!r0.length)throw new Error('공개 가능한 증거가 연결된 시설이 없습니다. 비공개 근거로 공개 파일을 만들 수 없습니다.');const keptFs=new Set(r0.map(r=>r.facility_id));

 for(const r of filtered('finances'))if(r.recipient_org_id)refs.add(r.recipient_org_id);
 let orgs=(data.organizations||[]).filter(r=>refs.has(r.org_id)&&validEvidence(r));const orgSet=new Set(orgs.map(r=>r.org_id));
 const min=Math.max(10,data.meta.min_public_cell_n||10);const suppressed=[];
 function mask(t,rows){return rows.map(r=>{const c=deep(r);const fields=COUNT_FIELDS[t]||[];if(fields.some(k=>typeof c[k]==='number'&&c[k]<min)){for(const k of fields)c[k]=null;suppressed.push(t+'/'+r[IDS[t]]);}return c;});}
 const B={meta:{schema_version:'1.0.0',dataset_id:data.meta.dataset_id+'-PUBLIC-'+new Date().toISOString().slice(0,10),title:data.meta.title+' | 공개 승인본',as_of_date:data.meta.as_of_date,dataset_kind:data.meta.dataset_kind,publication_scope:'reviewer_approved',contains_personal_data:false,facility_reference:deep(data.meta.facility_reference),min_public_cell_n:min,method_notes:'공개승인: 소표본 전체 연동 계수 마스킹; 비공개 출처와 미승인 기관 제외. 원본의 자유서술 내부 메모는 공개하지 않음. 실제 익명성은 별도 검토 필요.'},organizations:orgs.map(r=>deep(r)),facilities:r0.map(r=>({...deep(r),operator_org_id:orgSet.has(r.operator_org_id)?r.operator_org_id:null})),finances:filtered('finances').map(r=>({...deep(r),recipient_org_id:orgSet.has(r.recipient_org_id)?r.recipient_org_id:null})),staff_aggregates:mask('staff_aggregates',filtered('staff_aggregates')),services:mask('services',filtered('services')),outcomes:mask('outcomes',(data.outcomes||[]).filter(r=>keptFs.has(r.facility_id)&&validEvidence(r))),governance:mask('governance',(data.governance||[]).filter(r=>orgSet.has(r.org_id)&&validEvidence(r))),evidence:[],reviews:[]};
 const used=new Set();for(const t of ['organizations','facilities','finances','staff_aggregates','services','outcomes','governance'])for(const r of B[t])for(const id of r.evidence_ids||[])used.add(id);
 B.evidence=publicEv.filter(r=>used.has(r.evidence_id)).map(deep);

 return {bundle:B,report:{generated_at:new Date().toISOString(),source_dataset:data.meta.dataset_id,approved_facilities:B.facilities.length,suppressed_records:suppressed,excluded_facilities:accepted.length-B.facilities.length,publication_scope:'reviewer_approved',cautions:['공개본은 원본을 보존하지 않음','10인 미만 소표본은 동일 레코드의 연동 계수를 모두 마스킹','다른 공개 데이터와 결합해 재식별할 위험에 대한 별도 심사 필요','합성 자료는 실제 성과 아님']}};

function safeDownload(name,data){const blob=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);}

function safeUrl(u){if(typeof u!=='string')return null;try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:null;}catch(e){return null;}}

function renderOutcomes(){return `<div class="box"><h2>당사자 결과 — 관찰과 인과효과 구별</h2><p class="muted">긍정응답 비율과 응답률을 구별하며 조사 설계·표본·출처를 함께 표시합니다.</p>${filterBar()}${renderTable('outcomes',db.outcomes||[])}<div class="banner info">사후 자기보고 비율은 센터의 인과적 사회성과로 해석할 수 없습니다.</div></div>`;}
function renderEvidence(){const issues=G.validate(db,schema),sum=G.issueSummary(issues);return `<div class="box"><div class="page-title"><div><h2>출처 및 검증 실험실</h2><span class="hint">데이터 무결성, 출처 참조, 회계·성과 계산 전제</span></div><button class="button" id="btn-run-validate">전체 검증</button></div><div class="banner ${sum.errors?'danger':'info'}">${sum.errors?'검증 오류 '+sum.errors+'건':'구조 검사에서 오류 없음'} · 주의 ${sum.warnings}건 (공공감사 또는 법적 검증 완료를 뜻하지 않음)</div><ul class="issues">${issues.slice(0,60).map(i=>`<li class="${x(i.level)}"><b>${x(i.path)}</b> · ${x(i.message)}</li>`).join('')||'<li>현재 검사 규칙에서 문제 없음</li>'}</ul><hr><div class="toolbar"><label class="button ghost" for="hash-file">증거 파일 SHA-256 확인</label><input id="hash-file" class="sr-only" type="file"><span class="hint" id="hash-result">파일은 서버나 원장에 업로드되지 않습니다.</span></div></div><div class="box"><h2>출처 문서</h2>${renderTable('evidence',db.evidence||[],'detail')}</div><div class="box"><h2>검토 이력 (외부 증빙 별도)</h2>${renderTable('reviews',db.reviews||[],'detail2')}</div>`;}
function renderPublish(){const actual=db.meta?.dataset_kind!=='synthetic_demo';return `<div class="box"><div class="eyebrow">OWNER APPROVAL GATE</div><h2>공개 데이터셋 생성</h2><p>오너가 시설을 선택하고 공개용 필드·출처·소표본 보호 검사를 통과한 **별도 JSON**만 리뷰어에게 전달합니다.</p><div class="banner ${actual?'danger':''}">${actual?'실제자료 공개에 앞서 법적 공개 권한, 출처 공개여부, 재식별 가능성에 대한 인간의 승인 절차가 필요합니다.':'현재 입력값은 모두 합성 실습자료입니다. 실제 시설·실적·투표 결과로 표시하지 마세요.'}</div><h3>공개 시설 선택</h3><div class="checkset">${(db.facilities||[]).map(r=>`<label><input type="checkbox" name="pub-fac" value="${x(r.facility_id)}" checked> <span>${x(r.facility_name)} <span class="hint">(${x(r.facility_id)})</span></span></label>`).join('')}</div><div class="note">기본 최소 공개 셀 기준 ${Math.max(10,db.meta?.min_public_cell_n||10)}. 10 미만의 단위별 집계가 포함되면 같은 행의 연동 계수를 함께 가립니다. 비공개 출처·내부 검토 기록·개인자료는 제외합니다.</div><label class="toggle"><input id="approve-source" type="checkbox">선택 시설·공개 출처·권리 및 재식별 위험을 확인했습니다.</label><div class="toolbar"><button class="button" id="btn-prepare-release">공개본 재계산·미리보기</button><button class="button ghost" id="btn-download-release" disabled>공개 JSON 다운로드</button><button class="button flat" id="btn-release-report" disabled>공개심사 기록 다운로드</button></div><div id="release-state" class="status" role="status"></div><pre class="json-preview" id="release-preview">미리보기를 실행하면 공개 JSON 구조가 여기에 표시됩니다.</pre></div>`;}
function renderEdit(){return `<div class="box"><h2>원장 편집 — JSON 단위 안전 저장</h2><p class="muted">v0.3에서는 스키마가 정한 10개 엔터티를 JSON으로 편집합니다. 데이터 검증을 통과한 경우에만 기존 로컬 원장을 교체하며, IndexedDB에 이전 스냅샷을 남깁니다.</p><div class="banner">비식별·집계 데이터만 입력하세요. 이름, 전화번호, 회원명부, 원본 민원 서술, 영상은 저장하지 마세요.</div><div class="field"><label for="editor">원장 JSON 전체</label><textarea id="editor" spellcheck="false" aria-label="원장 JSON 편집기"></textarea></div><div class="toolbar"><button class="button" id="btn-save-edited">검증 후 로컬 저장</button><button class="button ghost" id="btn-reset-editor">원본으로 되돌리기</button></div><div id="edit-message" role="status" class="status"></div></div>`;}
function render(){updateHeader();document.querySelectorAll('.nav button').forEach(b=>{b.setAttribute('aria-current',b.dataset.nav===tab?'page':'false');});$('page-name').textContent=menu[tab];let content='';if(tab==='home')content=renderHome();else if(tab==='publish')content=renderPublish();else if(tab==='edit')content=renderEdit();else if(tab==='finances')content=renderFinance();else if(tab==='services')content=renderServices();else if(tab==='outcomes')content=renderOutcomes();else if(tab==='evidence')content=renderEvidence();else content=`<div class="box"><h2>${x(menu[tab])}</h2>${filterBar()}${renderTable(tab,db[tab]||[])}</div>`;
 $('content').innerHTML=content;if(tab==='edit')$('editor').value=JSON.stringify(db,null,2);}
function details(t,id,container){const r=(db[t]||[]).find(v=>String(v[G.IDS[t]])===id);if(!r)return;const evidence=G.lineage(r,db);const html=`<h3>기록 상세: ${x(id)}</h3><pre>${x(JSON.stringify(r,null,2))}</pre><h3>근거 추적 (${evidence.length})</h3>${evidence.map(e=>`<div class="lineage"><b>${x(e.title)}</b><div class="hint">${x(e.issuer||'출처 미확인')} | ${x(e.document_date)} | ${x(e.verification_state)}</div>${G.safeUrl(e.url)?`<a target="_blank" rel="noopener noreferrer" href="${x(G.safeUrl(e.url))}">공개 원문 열기</a>`:''}</div>`).join('')||'<span class="muted">연결된 증거 없음</span>'}`;container.innerHTML=html;container.scrollIntoView({behavior:'smooth',block:'nearest'});}
async function importJSON(file){if(!file)return;try{const text=await file.text();if(text.length>25*1024*1024)throw new Error('파일 크기 제한(25MB)을 초과합니다. 대량 자료는 분할 가져오세요.');const parsed=JSON.parse(text);const issues=G.validate(parsed,schema),summary=G.issueSummary(issues);if(summary.errors)throw new Error('검증 오류 '+summary.errors+'건: '+issues.filter(i=>i.level==='error').slice(0,2).map(i=>i.path+': '+i.message).join(' / '));if(!confirm('JSON 검증을 통과했습니다. 현재 화면 데이터를 가져온 데이터로 교체할까요? 기존 브라우저 저장본은 변경되지 않습니다.'))return;db=parsed;stored=false;releaseCache=null;filter={facility:'all',year:'all',search:''};tab='home';render();toast('JSON 가져오기 완료. 영구 저장하려면 상단의 [로컬 저장]을 누르세요.');}catch(e){toast('가져오기 실패: '+e.message,true);}finally{$('file-json').value='';}}
async function save(){const issues=G.validate(db,schema),n=G.issueSummary(issues);if(n.errors)return toast('검증 오류 '+n.errors+'건으로 저장 중지',true);try{await G.storeData(db);stored=true;updateHeader();toast('현재 집계 원장을 브라우저 IndexedDB에 저장하고 스냅샷을 남겼습니다.');}catch(e){toast('브라우저 저장 실패: '+e.message+' — JSON 백업 파일을 확보하세요.',true);}}
function releaseNow(){const selected=[...document.querySelectorAll('input[name="pub-fac"]:checked')].map(e=>e.value);const confirmed=$('approve-source')?.checked;if(!confirmed){$('release-state').textContent='공개 권한·출처·재식별 위험 확인을 먼저 선택하세요.';return;}try{releaseCache=G.release(db,selected,schema);$('release-preview').textContent=JSON.stringify(releaseCache.bundle,null,2).slice(0,16000)+'\n… (미리보기 일부, 다운로드 파일에는 전체 포함)';$('btn-download-release').disabled=false;$('btn-release-report').disabled=false;$('release-state').textContent='공개 검증 완료: '+releaseCache.bundle.facilities.length+'개 시설, 소표본 보호 처리 '+releaseCache.report.suppressed_records.length+'건, 제외 '+releaseCache.report.excluded_facilities+'개 시설. 최종 인간 승인은 별도 필요.';}catch(e){releaseCache=null;$('release-state').textContent='공개 차단: '+e.message;$('release-preview').textContent='공개본이 생성되지 않았습니다.';}}
async function saveEdited(){try{const parsed=JSON.parse($('editor').value);const issues=G.validate(parsed,schema),n=G.issueSummary(issues);if(n.errors)throw new Error(n.errors+'건: '+issues.filter(i=>i.level==='error').slice(0,3).map(i=>i.path+' '+i.message).join(' / '));if(!confirm('검증된 JSON으로 현재 원장을 바꾸고 IndexedDB에 저장합니까?'))return;await G.storeData(parsed);db=parsed;stored=true;releaseCache=null;render();toast('편집한 원장을 검증 후 저장했습니다.');}catch(e){$('edit-message').textContent='저장 실패: '+e.message;}}
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-nav]');if(nav){tab=nav.dataset.nav;render();return;}const detail=e.target.closest('[data-detail-id]');if(detail){const cont=detail.closest('.box').querySelector('.detail');if(cont)details(detail.dataset.detailTab,detail.dataset.detailId,cont);return;}const btn=e.target.closest('button');if(!btn)return;switch(btn.id){case 'btn-demo':if(confirm('현재 화면 데이터는 합성 예시로 교체됩니다. 계속할까요?')){db=G.deep(demo);stored=false;filter={facility:'all',year:'all',search:''};tab='home';render();toast('합성 실습자료를 로드했습니다.');}break;case 'btn-save':await save();break;case 'btn-backup':G.safeDownload('GARD_DPA_OWNER_BACKUP_'+new Date().toISOString().slice(0,10)+'.json',db);toast('JSON 백업 파일이 생성되었습니다. 안전한 장소에 보관하세요.');break;case 'btn-run-validate':toast('검증 결과를 갱신했습니다.');render();break;case 'btn-prepare-release':releaseNow();break;case 'btn-download-release':if(releaseCache)G.safeDownload('GARD_DPA_PUBLIC_APPROVED.json',releaseCache.bundle);break;case 'btn-release-report':if(releaseCache)G.safeDownload('GARD_DPA_PUBLIC_RELEASE_REPORT.json',releaseCache.report);break;case 'btn-save-edited':await saveEdited();break;case 'btn-reset-editor':if(confirm('편집 중인 내용을 버리고 현재 원장으로 복원할까요?'))$('editor').value=JSON.stringify(db,null,2);break;}});
document.addEventListener('change',async e=>{if(e.target.id==='file-json')return importJSON(e.target.files[0]);if(e.target.id==='f-facility'){filter.facility=e.target.value;render();return;}if(e.target.id==='f-year'){filter.year=e.target.value;render();return;}if(e.target.id==='hash-file'){const file=e.target.files?.[0];if(!file)return;try{if(!crypto?.subtle)throw new Error('보안 컨텍스트(HTTPS 또는 localhost) 필요');const dig=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());$('hash-result').textContent=[...new Uint8Array(dig)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(er){$('hash-result').textContent='해시 계산 불가: '+er.message;}}});
let searchTimer=null;document.addEventListener('input',e=>{if(e.target.id!=='f-search')return;const v=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{filter.search=v;render();const inp=$('f-search');if(inp){inp.focus();inp.setSelectionRange(v.length,v.length);}},280);});
(async()=>{try{const b=await G.loadData();if(b){const issues=G.validate(b,schema);if(!issues.some(i=>i.level==='error')){db=b;stored=true;toast('브라우저에 보관된 원장을 복원했습니다.');}else{toast('저장된 원장에 검증 오류가 있어 합성 예시로 시작합니다. 기존 저장자료는 변경하지 않았습니다.',true);}}else toast('실제자료는 포함하지 않았습니다. 합성 실습자료를 메모리에만 표시합니다.');}catch(e){toast('로컬 저장소 접근 제한: '+e.message+'. 현재 화면은 메모리에서만 동작합니다.',true);}render();})();
})();
</script></body></html>
