 if(data.meta.contains_personal_data)throw new Error('개인정보 포함 데이터 공개 금지');
 if(!Array.isArray(facIds)||!facIds.length)throw new Error('공개할 시설을 하나 이상 선택하세요');
 const fs=new Set(facIds);const accepted=(data.facilities||[]).filter(r=>fs.has(r.facility_id));if(!accepted.length)throw new Error('선택한 시설이 데이터셋에 없습니다');
 const publicEv=(data.evidence||[]).filter(r=>r.access_scope==='public');const evSet=new Set(publicEv.map(r=>r.evidence_id));
 const validEvidence=r=>Array.isArray(r.evidence_ids)&&r.evidence_ids.length>0&&r.evidence_ids.every(id=>evSet.has(id));
 const r0=accepted.filter(validEvidence);if(!r0.length)throw new Error('공개 가능한 증거가 연결된 시설이 없습니다. 비공개 근거로 공개 파일을 만들 수 없습니다.');const keptFs=new Set(r0.map(r=>r.facility_id));
 const filtered=t=>(data[t]||[]).filter(r=>keptFs.has(r.facility_id)&&validEvidence(r));
 const refs=new Set(r0.map(r=>r.operator_org_id).filter(Boolean));
 for(const r of filtered('finances'))if(r.recipient_org_id)refs.add(r.recipient_org_id);
 let orgs=(data.organizations||[]).filter(r=>refs.has(r.org_id)&&validEvidence(r));const orgSet=new Set(orgs.map(r=>r.org_id));
 const min=Math.max(10,data.meta.min_public_cell_n||10);const suppressed=[];
 function mask(t,rows){return rows.map(r=>{const c=deep(r);const fields=COUNT_FIELDS[t]||[];if(fields.some(k=>typeof c[k]==='number'&&c[k]<min)){for(const k of fields)c[k]=null;suppressed.push(t+'/'+r[IDS[t]]);}return c;});}
 const B={meta:{schema_version:'1.0.0',dataset_id:data.meta.dataset_id+'-PUBLIC-'+new Date().toISOString().slice(0,10),title:data.meta.title+' | 공개 승인본',as_of_date:data.meta.as_of_date,dataset_kind:data.meta.dataset_kind,publication_scope:'reviewer_approved',contains_personal_data:false,facility_reference:deep(data.meta.facility_reference),min_public_cell_n:min,method_notes:'공개승인: 소표본 전체 연동 계수 마스킹; 비공개 출처와 미승인 기관 제외. 원본의 자유서술 내부 메모는 공개하지 않음. 실제 익명성은 별도 검토 필요.'},organizations:orgs.map(r=>deep(r)),facilities:r0.map(r=>({...deep(r),operator_org_id:orgSet.has(r.operator_org_id)?r.operator_org_id:null})),finances:filtered('finances').map(r=>({...deep(r),recipient_org_id:orgSet.has(r.recipient_org_id)?r.recipient_org_id:null})),staff_aggregates:mask('staff_aggregates',filtered('staff_aggregates')),services:mask('services',filtered('services')),outcomes:mask('outcomes',(data.outcomes||[]).filter(r=>keptFs.has(r.facility_id)&&validEvidence(r))),governance:mask('governance',(data.governance||[]).filter(r=>orgSet.has(r.org_id)&&validEvidence(r))),evidence:[],reviews:[]};
 const used=new Set();for(const t of ['organizations','facilities','finances','staff_aggregates','services','outcomes','governance'])for(const r of B[t])for(const id of r.evidence_ids||[])used.add(id);
 B.evidence=publicEv.filter(r=>used.has(r.evidence_id)).map(deep);
 const checked=validate(B,schema);const errors=checked.filter(x=>x.level==='error');if(errors.length)throw new Error('공개본 검증 실패: '+errors[0].path+' / '+errors[0].message);
 return {bundle:B,report:{generated_at:new Date().toISOString(),source_dataset:data.meta.dataset_id,approved_facilities:B.facilities.length,suppressed_records:suppressed,excluded_facilities:accepted.length-B.facilities.length,publication_scope:'reviewer_approved',cautions:['공개본은 원본을 보존하지 않음','10인 미만 소표본은 동일 레코드의 연동 계수를 모두 마스킹','다른 공개 데이터와 결합해 재식별할 위험에 대한 별도 심사 필요','합성 자료는 실제 성과 아님']}};
}
function safeDownload(name,data){const blob=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in root))return reject(new Error('IndexedDB 사용 불가'));const r=indexedDB.open('GARD_DPA_OWNER_V1',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('datasets'))r.result.createObjectStore('datasets');if(!r.result.objectStoreNames.contains('snapshots'))r.result.createObjectStore('snapshots',{autoIncrement:true});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function storeData(d){const db=await openDB();return new Promise((resolve,reject)=>{const t=db.transaction(['datasets','snapshots'],'readwrite');t.objectStore('datasets').put(deep(d),'active');t.objectStore('snapshots').add({savedAt:new Date().toISOString(),bundle:deep(d)});t.oncomplete=()=>{db.close();resolve(true);};t.onerror=()=>{db.close();reject(t.error);};});}
async function loadData(){const db=await openDB();return new Promise((resolve,reject)=>{const t=db.transaction('datasets','readonly');const r=t.objectStore('datasets').get('active');r.onsuccess=()=>{db.close();resolve(r.result||null);};r.onerror=()=>{db.close();reject(r.error);};});}
function issueSummary(issues){const n=issues.filter(i=>i.level==='error').length,w=issues.filter(i=>i.level==='warning').length;return {errors:n,warnings:w,passed:n===0};}
function safeUrl(u){if(typeof u!=='string')return null;try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:null;}catch(e){return null;}}
root.GARD={TABLES,IDS,LABELS,STAGES,parse,esc,fmt,pct,validate,metrics,lineage,release,safeDownload,storeData,loadData,issueSummary,safeUrl,deep};
})(window);
</script><script>(function(){
'use strict';const G=window.GARD, schema=G.parse('schema-json'),sample=G.parse('sample-public-json');let bundle=G.deep(sample),tab='overview',facility='all',reviewNotes='';const $=id=>document.getElementById(id),x=G.esc;
const tabs={overview:'공개현황',facilities:'시설·운영법인',finances:'재정 재계산',services:'서비스·성과',evidence:'증거 추적',review:'독립검증·보고서'};
const keys={facilities:['facility_id','facility_name','region_name','operator_org_id','operating_status'],finances:['finance_id','facility_id','fiscal_year','accounting_stage','amount_krw','money_flow_id'],services:['service_record_id','facility_id','period_start','period_end','requests_total','completed_requests','unserved_requests','pending_requests','unique_users'],outcomes:['outcome_id','facility_id','outcome_type','respondents','positive_responses','eligible_cohort_count','study_design'],evidence:['evidence_id','title','issuer','document_date','access_scope','verification_state'],organizations:['org_id','org_name','legal_form','role'],governance:['governance_id','org_id','fiscal_year','eligible_voters','ballots_cast','formal_complaints_received']};
function note(s,error=false){$('status').textContent=s;$('status').style.color=error?'#a0243e':'#176347';}
function tag(){return bundle.meta?.dataset_kind==='synthetic_demo'?'<span class="pill synthetic">합성 예시 · 실제 자료 아님</span>':'<span class="pill unknown">관측자료 · 검증 범위 확인</span>';}
function facSelector(){return `<div class="filters no-print"><div><label for="reviewer-fac">시설 선택</label><select id="reviewer-fac"><option value="all">모든 승인 시설</option>${(bundle.facilities||[]).map(f=>`<option value="${x(f.facility_id)}" ${facility===f.facility_id?'selected':''}>${x(f.facility_name)}</option>`).join('')}</select></div></div>`;}
function showTable(kind,rows){const fields=keys[kind];const good=rows.filter(r=>facility==='all'||r.facility_id===facility||r.org_id===(bundle.facilities||[]).find(f=>f.facility_id===facility)?.operator_org_id);return `<div class="tblwrap"><table><thead><tr>${fields.map(k=>`<th>${x(k)}</th>`).join('')}<th>자세히</th></tr></thead><tbody>${good.slice(0,200).map(r=>`<tr>${fields.map(k=>`<td>${x(k==='accounting_stage'?G.STAGES[r[k]]:G.fmt(r[k]))}</td>`).join('')}<td><button class="linkbutton" data-record-kind="${x(kind)}" data-record-id="${x(r[G.IDS[kind]])}">근거</button></td></tr>`).join('')||`<tr><td colspan="${fields.length+1}">해당 기록 없음</td></tr>`}</tbody></table></div><div class="detail" id="detail-${x(kind)}" style="margin-top:14px" aria-live="polite">행의 [근거]를 눌러 출처와 원본 레코드를 확인하세요.</div>`;}
function summary(){const m=G.metrics(bundle,{facility});const rate=m.serviceRate?G.pct(m.serviceRate.num,m.serviceRate.den):'판단불가';return `<div class="box"><div class="eyebrow">READ-ONLY / INDEPENDENT REVIEWER</div><h2>공개 데이터의 재계산 결과</h2><p>${tag()} &nbsp; <span class="muted">${x(bundle.meta.title)} · 기준일 ${x(bundle.meta.as_of_date)}</span></p><div class="banner info">이 화면은 오너가 수동 전달한 JSON만 처리합니다. 원본을 변경하거나 비공개 기록에 접근하지 않습니다.</div>${facSelector()}<div class="cards"><div class="kpi">승인 시설 수<strong>${G.fmt(m.facilityCount)}</strong><div class="hint">공개범위에 포함된 수</div></div><div class="kpi">종결신청 충족률<strong>${rate}</strong><div class="hint">${m.serviceRate?G.fmt(m.serviceRate.num)+' / '+G.fmt(m.serviceRate.den):'미확인'} · 동일 단위</div></div><div class="kpi">공개 출처<strong>${G.fmt(m.evidenceCount)}</strong><div class="hint">메타·근거 연결만</div></div><div class="kpi">외부 검증 완료<strong>판단불가</strong><div class="hint">작성자가 표기한 상태는 독립감사 아님</div></div></div><h3>회계단계별 재계산</h3><div class="segment">${Object.entries(m.finance).map(([k,v])=>`<div class="stage">${x(G.STAGES[k])}<b>${v.count?G.fmt(v.total)+'원':'미확인'}</b><span class="hint">${v.count}건 · ${v.facilities}개 시설</span></div>`).join('')}</div><div class="banner">예산·지급·지출 등 단계별 금액을 합산한 총액은 만들지 않습니다. 기관 간 고유 이용자 수도 더하지 않습니다.</div></div>`;}
function finances(){const m=G.metrics(bundle,{facility});return `<div class="box"><h2>재정 원장 · 동일 회계단계만 합산</h2>${facSelector()}<div class="segment">${Object.entries(m.finance).map(([k,v])=>`<div class="stage">${x(G.STAGES[k])}<b>${v.count?G.fmt(v.total)+'원':'미확인'}</b></div>`).join('')}</div><div class="banner">가상 예산 4억원과 지급 3.7억원은 총액 7.7억원이 아닙니다. 커버리지가 다를 때 집행률도 계산하지 않습니다.</div>${showTable('finances',bundle.finances||[])}</div>`;}
function services(){const m=G.metrics(bundle,{facility});const outcomes=m.outcomes||[];return `<div class="box"><h2>서비스 처리와 당사자 결과</h2>${facSelector()}<div class="note">종결 충족률 = 완료건 / (완료건 + 미충족건). 응답자 긍정률 = 긍정응답 / 응답자. 두 지표 모두 '인과효과'가 아닙니다.</div><h3>종결 신청 처리</h3><p><b>${m.serviceRate?G.pct(m.serviceRate.num,m.serviceRate.den):'판단불가'}</b> (${m.serviceRate?G.fmt(m.serviceRate.num)+' / '+G.fmt(m.serviceRate.den):'분자/분모 누락'})</p>${showTable('services',bundle.services||[])}<h3>당사자 결과: 표본 및 연구설계</h3>${outcomes.map(o=>`<div class="lineage"><b>${x(o.outcome_type)}</b><div>긍정응답 ${G.pct(o.positive_responses,o.respondents)} (${G.fmt(o.positive_responses)}/${G.fmt(o.respondents)})</div><div>응답률 ${G.pct(o.respondents,o.eligible_cohort_count)} · ${x(o.study_design)}</div><div class="hint">${x(o.cohort_population)}. 전체 농인 비율 또는 정책 인과효과로 환산 금지.</div></div>`).join('')||'<p class="muted">공개 가능한 집계조사 자료가 없습니다.</p>'}</div>`;}
function facilities(){return `<div class="box"><h2>운영 시설과 운영 법인</h2>${facSelector()}<p class="hint">운영 법인의 등록·관리 여부와 시설 회계는 서로 다른 주체입니다.</p>${showTable('facilities',bundle.facilities||[])}<h3>운영법인</h3>${showTable('organizations',bundle.organizations||[])}<h3>자치·의결 지표</h3><div class="banner">법인 회원 의결 참여율은 전체 농인 인구 대비 비율이 아닙니다. 마스킹된 값은 계산하지 않습니다.</div>${showTable('governance',bundle.governance||[])}</div>`;}
function evidence(){return `<div class="box"><h2>공개 출처 추적</h2><p class="muted">제공된 증거 메타의 존재와 자료의 사실성이 동일하지 않습니다. 실제 문서 확인과 독립 검증은 별도입니다.</p>${showTable('evidence',bundle.evidence||[])}<h3>검증 표기와 공개범위</h3><p>${tag()} · <span class="hint">모든 공개 출처는 <code>access_scope=public</code>이어야 합니다.</span></p></div>`;}
function reportData(){const iss=G.validate(bundle,schema);const s=G.issueSummary(iss);const m=G.metrics(bundle,{facility});return {report_type:'GARD_DPA_Independent_Review',created_at:new Date().toISOString(),dataset_id:bundle.meta?.dataset_id||null,dataset_kind:bundle.meta?.dataset_kind||null,verified_schema_version:bundle.meta?.schema_version||null,independent_calculations:{facility_count:m.facilityCount,finance_by_stage:m.finance,closed_fulfillment:m.serviceRate?{numerator:m.serviceRate.num,denominator:m.serviceRate.den,percent:m.serviceRate.value*100}:null},validation:s,issues:iss,reviewer_notes:reviewNotes,limitations:['이 도구는 전달받은 JSON의 구조와 산식을 독립 재계산하며 실제 원본의 진위는 자동 검증하지 않음','개인정보 비식별 수준과 소표본 재식별 위험은 추가 검토 필요','합성 예시는 실제 정책 실적이 아님','의결권자 대비 투표율은 전체 농인 인구의 민주적 대표성을 뜻하지 않음']};}
function review(){const r=reportData();return `<div class="box"><h2>독립 검증 및 이견 기록</h2><div class="banner ${r.validation.errors?'danger':'info'}">데이터 규칙 검사 ${r.validation.passed?'통과':'실패'} · 오류 ${r.validation.errors}건 · 주의 ${r.validation.warnings}건. 이는 자료 진위 또는 회계감사 인증이 아닙니다.</div><ul class="issues">${r.issues.slice(0,80).map(i=>`<li class="${x(i.level)}"><b>${x(i.path)}</b> · ${x(i.message)}</li>`).join('')||'<li>현재 규칙으로 검출된 구조·연산 문제 없음</li>'}</ul><div class="field"><label for="reviewer-notes">독립 검토 의견 · 누락·이견</label><textarea id="reviewer-notes" placeholder="예: 실제 문서 확인 필요, 모수 불일치 가능성, 근거 문서 URL 대조 필요"></textarea></div><div class="toolbar no-print"><button class="button" id="download-review">검증 보고서 JSON 다운로드</button><button class="button ghost" id="print-review">인쇄 / PDF 저장</button></div><div class="note">검토 의견은 원본 JSON에 기록되지 않으며 보고서를 다운로드할 때에만 포함됩니다. 서버로 자동 전송하지 않습니다.</div></div>`;}
function render(){const meta=bundle.meta||{};$('data-title').textContent=meta.title||'공개본 없음';$('data-date').textContent='자료 기준일 '+(meta.as_of_date||'미확인');document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));$('page-name').textContent=tabs[tab];$('content').innerHTML=tab==='overview'?summary():tab==='facilities'?facilities():tab==='finances'?finances():tab==='services'?services():tab==='evidence'?evidence():review();if(tab==='review')$('reviewer-notes').value=reviewNotes;}
function showDetail(t,id){const row=(bundle[t]||[]).find(r=>String(r[G.IDS[t]])===id);if(!row)return;const el=$('detail-'+t);if(!el)return;const chain=G.lineage(row,bundle);el.innerHTML=`<h3>${x(id)} · 원장 필드</h3><pre>${x(JSON.stringify(row,null,2))}</pre><h3>근거 연결 (${chain.length})</h3>${chain.map(ev=>`<div class="lineage"><b>${x(ev.title)}</b><div class="hint">발행자 ${x(ev.issuer)} | 상태 ${x(ev.verification_state)} | 기준일 ${x(ev.document_date)}</div>${G.safeUrl(ev.url)?`<a target="_blank" rel="noopener noreferrer" href="${x(G.safeUrl(ev.url))}">공식 원문</a>`:''}</div>`).join('')||'<p>증거 연결 없음</p>'}`;el.scrollIntoView({block:'nearest',behavior:'smooth'});}
async function importData(file){if(!file)return;try{const txt=await file.text();if(txt.length>25*1024*1024)throw Error('25MB 이상 파일 제한');const obj=JSON.parse(txt);if(obj.meta?.publication_scope!=='reviewer_approved')throw Error('오너 비공개 자료입니다. 승인된 공개 JSON만 불러오세요.');const issues=G.validate(obj,schema);const s=G.issueSummary(issues);if(s.errors)throw Error('검증 오류 '+s.errors+'건: '+issues.filter(i=>i.level==='error').slice(0,2).map(i=>i.path+' '+i.message).join(' / '));bundle=obj;tab='overview';facility='all';reviewNotes='';render();note('공개 원장 검증 및 가져오기 성공. 원본 파일은 서버로 전송되지 않았습니다.');}catch(e){note('승인 JSON 가져오기 차단: '+e.message,true);}finally{$('public-json-file').value='';}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return;}if(b.dataset.recordId){showDetail(b.dataset.recordKind,b.dataset.recordId);return;}switch(b.id){case 'demo':bundle=G.deep(sample);facility='all';reviewNotes='';tab='overview';render();note('비식별 공개용 합성 예시를 불러왔습니다.');break;case 'download-review':G.safeDownload('GARD_DPA_REVIEW_REPORT_'+new Date().toISOString().slice(0,10)+'.json',reportData());break;case 'print-review':window.print();break;}});
document.addEventListener('change',e=>{if(e.target.id==='public-json-file')importData(e.target.files[0]);if(e.target.id==='reviewer-fac'){facility=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='reviewer-notes')reviewNotes=e.target.value;});
render();note('공개 합성 JSON 예시를 읽기 전용으로 표시합니다.');
})();
</script></body></html>
